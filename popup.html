<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vamber AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="brand">
      <img src="icons/icon48.png" alt="" width="42" height="42">
      <div>
        <h1>Vamber <span>AI</span> <small class="version-label" id="currentVersion"></small></h1>
        <p>UI context assistant</p>
      </div>
      <button class="update-icon" id="updateButton" type="button" aria-label="No update available" title="No update available" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
        <span class="update-dot" aria-hidden="true"></span>
      </button>
    </header>


    <section class="settings" aria-label="Context detail">
      <div class="detail-heading">
        <strong>Context detail</strong>
        <small id="detailHint">Compact to save tokens</small>
      </div>
      <div class="detail-options" role="group" aria-label="Choose context detail">
        <button class="detail-option compact selected" type="button" data-detail="compact" aria-pressed="true">
          <span class="option-title">Compact</span>
        </button>
        <button class="detail-option detailed" type="button" data-detail="detailed" aria-pressed="false">
          <span class="option-title">Detailed</span>
        </button>
      </div>
          <p class="selection-hint"><kbd>Alt</kbd> + Left Click <span>· hover to preview</span></p>
    </section>

    <footer class="popup-footer">
      <div class="footer-credit" dir="ltr">
        <svg class="credit-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>
        <span>Designed &amp; Developed by <strong>Ahmed Al-jaberi</strong></span>
      </div>
      <nav class="footer-links" aria-label="Ahmed Al-jaberi links">
        <a class="footer-link" href="https://iq-cyborg.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="CYBORG website" title="CYBORG website">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        </a>
        <a class="footer-link" href="https://t.me/YYxYY" target="_blank" rel="noopener noreferrer" aria-label="Telegram" title="Telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M21.8 4.2 18.6 19c-.24 1.04-.86 1.3-1.75.81l-4.84-3.57-2.34 2.25c-.26.26-.48.48-.98.48l.35-4.93 8.98-8.12c.39-.35-.08-.55-.6-.2L6.32 12.8l-4.8-1.5c-1.04-.33-1.06-1.04.22-1.55L20.5 2.3c.86-.32 1.61.2 1.3 1.9Z"/></svg>
