<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vamber AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="brand">
      <img src="icons/icon48.png" alt="" width="42" height="42">
      <div>
        <h1>Vamber <span>AI</span></h1>
        <p>UI context assistant</p>
      </div>
      <span class="status" title="Extension ready"></span>
    </header>

    <section class="quickstart">
      <div class="eyebrow">SELECT AN ELEMENT</div>
      <div class="shortcut"><kbd>Alt</kbd><span>+</span><span class="mouse">Left Click</span></div>
      <p>Hold Alt to preview an element, then click to copy its context.</p>
    </section>

    <section class="settings" aria-label="Settings">
      <label class="setting-row" for="hoverPreview">
        <span><strong>Hover preview</strong><small>Show a cyan outline before selecting</small></span>
        <input id="hoverPreview" type="checkbox">
        <i class="switch" aria-hidden="true"></i>
      </label>
      <label class="setting-row" for="toast">
        <span><strong>Copy notification</strong><small>Show confirmation after copying</small></span>
        <input id="toast" type="checkbox">
        <i class="switch" aria-hidden="true"></i>
      </label>
      <div class="setting-row detail-row">
        <span><strong>Context detail</strong><small id="detailHint">Compact to save tokens</small></span>
        <select id="detail" aria-label="Context detail">
          <option value="compact">Compact</option>
          <option value="detailed">Detailed</option>
        </select>
      </div>
    </section>

    <footer>
      <span>Vamber AI</span>
      <span>© 2026 All rights reserved</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
